<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imposter - لعبة الإمبوستر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           إعدادات التصميم العام (CSS Variables)
           ========================================= */
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #151725;
            --primary-color: #ff2a75;
            --secondary-color: #6a0dad;
            --accent-color: #00e5ff;
            --text-color: #ffffff;
            --font-family: 'Cairo', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* حاوية اللعبة (بحجم شاشة الهاتف) */
        .game-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            background: linear-gradient(180deg, #0b0c10 0%, #1a0b2e 100%);
            position: relative;
            box-shadow: 0 0 30px rgba(106, 13, 173, 0.5);
            overflow: hidden;
            border-radius: 20px;
        }

        /* إخفاء الشاشات غير النشطة */
        .screen { display: none; height: 100%; flex-direction: column; padding: 20px; }
        .screen.active { display: flex; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* الأزرار */
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-bottom: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: var(--font-family);
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: linear-gradient(45deg, #ff2a75, #ff5e62); box-shadow: 0 0 15px rgba(255, 42, 117, 0.5); }
        .btn-secondary { background: #2a2a40; box-shadow: 0 0 10px rgba(42, 42, 64, 0.5); }
        .btn-purple { background: #5d2de6; box-shadow: 0 0 15px rgba(93, 45, 230, 0.5); }

        /* الشاشة الرئيسية */
        #screen-main { justify-content: center; align-items: center; text-align: center; }
        .logo { font-size: 48px; font-weight: 900; color: var(--primary-color); text-shadow: 0 0 20px var(--primary-color); margin-bottom: 10px; }
        .subtitle { font-size: 14px; color: #aaa; margin-bottom: 40px; }

        /* شاشات الإعدادات */
        .header { display: flex; align-items: center; margin-bottom: 20px; }
        .back-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; margin-left: 10px; }
        .header h2 { font-size: 20px; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #aaa; font-size: 14px; }
        .input-group input, .input-group select {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333;
            background: #1e1e2d; color: white; font-family: var(--font-family);
        }

        /* شاشة عرض الأدوار */
        .role-box {
            background: #1e1e2d; border: 2px solid var(--secondary-color); border-radius: 15px;
            padding: 30px; text-align: center; margin-top: 20px; display: flex; flex-direction: column; align-items: center;
        }
        .role-title { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .role-desc { color: #aaa; font-size: 14px; }

        /* شاشة النقاش */
        .timer { font-size: 36px; font-weight: bold; color: var(--accent-color); text-align: center; margin: 20px 0; text-shadow: 0 0 10px var(--accent-color); }
        .event-card { background: rgba(255, 42, 117, 0.1); border: 1px solid var(--primary-color); padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; }

        /* شاشة التصويت */
        .player-list { list-style: none; overflow-y: auto; flex-grow: 1; }
        .player-item {
            background: #1e1e2d; padding: 15px; border-radius: 10px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .player-item:hover { background: #2a2a40; border: 1px solid var(--primary-color); }

        /* شاشة النتيجة */
        .result-card { text-align: center; margin-top: 50px; }
        .result-title { font-size: 28px; margin-bottom: 20px; }
        .win { color: #00ff88; text-shadow: 0 0 15px #00ff88; }
        .lose { color: var(--primary-color); text-shadow: 0 0 15px var(--primary-color); }
    </style>
</head>

<div class="game-container">
    <!-- 1. الشاشة الرئيسية -->

        <h1 class="logo">IMPOSTER</h1>
        <p class="subtitle">اكتشف المحتال قبل فوات الأوان</p>

    <!-- 2. شاشة الإعدادات -->
    <div id="screen-settings" class="screen">

        </div>

            <input type="text" id="player-names" placeholder="أحمد, سارة, يوسف, ليلى">
        </div>
        <div class="input-group">
            <label>فئة الكلمات:</label>
            <select id="category">
                <option value="animals">حيوانات 🐶</option>
                <option value="jobs">"jobs"  </option>
                <option value="places">أماكن 📍</option>
                <option value="tech">تكنولوجيا 💻</option>
                <option value="tech1">dddd </option>
            </select>
        </div>
        <button class="btn btn-purple" onclick="validateAndStart()">التالي</button>
    </div>

    <!-- 3. شاشة عرض الأدوار (تمرير الهاتف) -->
    <div id="screen-roles" class="screen">
        <div class="header">
            <h2 id="pass-phone-title">مرر الهاتف إلى...</h2>
        </div>
        <div style="text-align: center; margin-top: 50px;">
            <h1 id="current-player-name" style="font-size: 32px; color: var(--accent-color);">اللاعب</h1>
            <p style="color: #aaa; margin-top: 10px;">هل أنت مستعد لرؤية دورك؟</p>
        </div>
        <div class="role-box" id="role-reveal-box" style="display: none;">
            <h2 id="role-name" class="role-title">دورك</h2>
            <p id="role-word" class="role-desc">الكلمة السرية</p>
        </div>
        <button class="btn btn-primary" id="reveal-btn" onclick="revealRole()" style="margin-top: auto;">إظهار الدور 👁️</button>
        <button class="btn btn-secondary" id="next-btn" onclick="nextPlayerRole()" style="display: none;">التالي ➔</button>
    </div>

    <!-- 4. شاشة النقاش -->
    <div id="screen-discussion" class="screen">
        <div class="header">
            <h2>مرحلة النقاش 🗣️</h2>
        </div>
        <div class="timer" id="timer-display">02:00</div>
        <div class="event-card" id="event-box" style="display: none;">
            <h3 style="color: var(--primary-color);">حدث نشط!</h3>
            <p id="event-text">...</p>
        </div>
        <button class="btn btn-purple" onclick="triggerRandomEvent()">تفعيل حدث عشوائي ⚡</button>
        <button class="btn btn-primary" onclick="startVoting()" style="margin-top: auto;">بدء التصويت 🗳️</button>
    </div>

    <!-- 5. شاشة التصويت -->
    <div id="screen-voting" class="screen">
        <div class="header">
            <h2>من تشتبه به؟ 🤔</h2>
        </div>
        <ul class="player-list" id="voting-list">
            <!-- سيتم توليد اللاعبين هنا عبر JS -->
        </ul>
    </div>

    <!-- 6. شاشة النتائج -->
    <div id="screen-results" class="screen">
        <div class="result-card">
            <h1 class="result-title" id="result-title">النتيجة</h1>
            <div class="role-box" style="border-color: var(--primary-color);">

            </div>
            <button class="btn btn-primary" onclick="location.reload()" style="margin-top: 40px;">لعبة جديدة 🔄</button>
        </div>
    </div>
</div>

// التنقل بين الشاشات
function goToScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

// 1. التحقق من الإعدادات وبدء اللعبة
function validateAndStart() {
    const count = parseInt(document.getElementById('player-count').value);
    const namesInput = document.getElementById('player-names').value;
    const category = document.getElementById('category').value;

    // التحقق من صحة البيانات (مطابقة للـ Flowchart: Paramètres valides ?)
    if (count < 4 || count > 10) {
        alert("يجب أن يكون عدد اللاعبين بين 4 و 10!");
        return;
    }

    let names = namesInput.split(',').map(n => n.trim()).filter(n => n !== "");
    
    // إذا لم يتم إدخال أسماء كافية، نقوم بتوليد أسماء افتراضية
    while (names.length < count) {
        names.push(`لاعب ${names.length + 1}`);
    }
    names = names.slice(0, count); // قص الأسماء الزائدة

    gameData.players = names;
    
    // اختيار كلمة سرية وإمبوستر عشوائي (مطابقة للـ Flowchart)
    const categoryWords = wordsDB[category];
    gameData.secretWord = categoryWords[Math.floor(Math.random() * categoryWords.length)];
    gameData.imposterIndex = Math.floor(Math.random() * count);

    // الانتقال لشاشة توزيع الأدوار
    gameData.currentRoleIndex = 0;
    showRoleScreen();
}

// 2. شاشة عرض الأدوار (تمرير الهاتف)
function showRoleScreen() {
    goToScreen('screen-roles');
    document.getElementById('current-player-name').innerText = gameData.players[gameData.currentRoleIndex];
    document.getElementById('role-reveal-box').style.display = 'none';
    document.getElementById('reveal-btn').style.display = 'block';
    document.getElementById('next-btn').style.display = 'none';
}

function revealRole() {
    const isImposter = (gameData.currentRoleIndex === gameData.imposterIndex);
    document.getElementById('role-reveal-box').style.display = 'block';
    
    if (isImposter) {
        document.getElementById('role-name').innerText = "أنت الإمبوستر! 🕵️‍♂️";
        document.getElementById('role-name').style.color = "var(--primary-color)";
        document.getElementById('role-word').innerText = "حاول تخمين الكلمة السرية أو التمويه!";
    } else {
        document.getElementById('role-name').innerText = "أنت لاعب عادي 👤";
        document.getElementById('role-name').style.color = "var(--accent-color)";
        document.getElementById('role-word').innerText = `الكلمة السرية: ${gameData.secretWord}`;
    }

    document.getElementById('reveal-btn').style.display = 'none';
    document.getElementById('next-btn').style.display = 'block';
}

function nextPlayerRole() {
    gameData.currentRoleIndex++;
    // التحقق: هل شاهد جميع اللاعبين أدوارهم؟ (Tous les joueurs ont vu leur rôle ?)
    if (gameData.currentRoleIndex < gameData.players.length) {
        showRoleScreen();
    } else {
        startDiscussion();
    }
}

// 3. مرحلة النقاش
function startDiscussion() {
    goToScreen('screen-discussion');
    gameData.timeLeft = 120;
    updateTimerDisplay();
    
    if (gameData.timerInterval) clearInterval(gameData.timerInterval);
    gameData.timerInterval = setInterval(() => {
        gameData.timeLeft--;
        updateTimerDisplay();
        if (gameData.timeLeft <= 0) {
            clearInterval(gameData.timerInterval);
            alert("انتهى الوقت! حان وقت التصويت.");
        }
    }, 1000);
}

function updateTimerDisplay() {
    const minutes = Math.floor(gameData.timeLeft / 60).toString().padStart(2, '0');
    const seconds = (gameData.timeLeft % 60).toString().padStart(2, '0');
    document.getElementById('timer-display').innerText = `${minutes}:${seconds}`;
}

// 4. الأحداث العشوائية
const events = [
    "منع التلميحات: لا يمكن لأحد إعطاء تلميحات!",
    "منع الأسئلة: لا يمكن طرح أي أسئلة!",
    "تلميح إضافي: الإمبوستر يحصل على تلميح سري."
];
function triggerRandomEvent() {
    const eventBox = document.getElementById('event-box');
    const eventText = document.getElementById('event-text');
    const randomEvent = events[Math.floor(Math.random() * events.length)];
    
    eventText.innerText = randomEvent;
    eventBox.style.display = 'block';
}

// 5. التصويت
function startVoting() {
    clearInterval(gameData.timerInterval);
    goToScreen('screen-voting');
    const list = document.getElementById('voting-list');
    list.innerHTML = '';

    gameData.players.forEach((name, index) => {
        const li = document.createElement('li');
        li.className = 'player-item';
        li.innerHTML = `<span>${name}</span> <span>🗳️</span>`;
        li.onclick = () => castVote(index, name);
        list.appendChild(li);
    });
}

function castVote(votedIndex, votedName) {
    // محاكاة تصويت اللاعبين (لتبسيط اللعبة في الواجهة، سيتم اختيار عشوائي)
    const votedOutIndex = Math.floor(Math.random() * gameData.players.length);
    const votedOutName = gameData.players[votedOutIndex];
    
    // إيقاف التصويت والانتقال للنتائج
    checkResults(votedOutIndex);
}

// 6. حساب النتائج (مطابقة للـ Flowchart)
function checkResults(ejectedIndex) {
    goToScreen('screen-results');
    const imposterName = gameData.players[gameData.imposterIndex];
    
    document.getElementById('result-imposter').innerText = `الإمبوستر هو: ${imposterName}`;
    document.getElementById('result-word').innerText = `الكلمة السرية كانت: ${gameData.secretWord}`;

    const resultTitle = document.getElementById('result-title');

    // هل تم طرد الإمبوستر؟ (Le joueur choisi est l'Imposter ?)
    if (ejectedIndex === gameData.imposterIndex) {
        // هل فرصة التخمين الأخير مفعلة؟ (Dernière chance activée ?)
        // محاكاة تخمين الإمبوستر
        const guessCorrect = confirm("تم اكتشاف الإمبوستر! (فرصة أخيرة)\nهل ينجح الإمبوستر في تخمين الكلمة السرية؟\nاضغط موافق إذا خمّن بشكل صحيح، وإلغاء إذا خسر.");
        
        if (guessCorrect) {
            resultTitle.innerText = "فوز الإمبوستر! 🕵️‍♂️🏆";
            resultTitle.className = "result-title lose";
        } else {
            resultTitle.innerText = "فوز اللاعبين العاديين! 🎉";
            resultTitle.className = "result-title win";
        }
    } else {
        // لم يتم اكتشاف الإمبوستر (L'Imposter gagne après un vote incorrect ?)
        resultTitle.innerText = "فوز الإمبوستر! 🕵️‍♂️🏆";
        resultTitle.className = "result-title lose";
    }
}
